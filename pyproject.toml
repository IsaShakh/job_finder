[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-finder"
version = "0.1.0"
description = "Personal job search agent with Telegram delivery"
requires-python = ">=3.12"
dependencies = ["playwright>=1.51,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2", "cryptography>=42,<46"]

[project.scripts]
job-finder = "job_finder.__main__:main"

[tool.setuptools.packages.find]
include = ["job_finder*"]

[tool.setuptools.package-data]
job_finder = ["profile.json"]
